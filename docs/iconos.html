<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galería de iconos</title>
    <style>
      body { margin: 0; padding: 16px; background: #24123f; color: #fff; font-family: system-ui, sans-serif; }
      h1 { font-size: 1rem; margin: 0 0 12px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 14px; background: rgba(255,255,255,.07); font-size: .62rem; text-align: center; }
      .big { font-size: 56px; }
      .small { font-size: 22px; }
      .ic { width: 1.15em; height: 1.15em; display: inline-block; vertical-align: -0.2em; }
    </style>
  </head>
  <body>
    <h1>Iconos del juego (solo desarrollo)</h1>
    <div class="grid" id="grid"></div>
    <script type="module">
      import { mountIcons, icon, ICON_NAMES } from '/src/ui/icons.js';
      mountIcons();
      document.getElementById('grid').innerHTML = ICON_NAMES.map(
        (n) => `<div class="cell"><span class="big">${icon(n)}</span><span class="small">${icon(n)}</span>${n}</div>`,
      ).join('');
    </script>
  </body>
</html>
